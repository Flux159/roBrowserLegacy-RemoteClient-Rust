name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # Without this a failing lib test hides every integration suite, which is
      # exactly how a Windows-only break stayed invisible the first time.
      - run: cargo test --all-targets --no-fail-fast
      - run: cargo build --release

  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Report binary size
        run: |
          size=$(stat -c%s target/release/robrowser-remoteclient)
          echo "binary: $size bytes ($((size / 1024)) KiB)"
          # The whole point of this project is not shipping a language runtime.
          # Fail loudly rather than drift back towards one.
          test "$size" -lt 8000000
