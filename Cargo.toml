[package]
name = "robrowser-remoteclient"
version = "1.0.5"
edition = "2021"
rust-version = "1.88"
description = "Single-binary roBrowserLegacy Remote Client: static server, GRF asset server and WebSocket-to-TCP proxy"
license = "GPL-3.0-or-later"
repository = "https://github.com/Flux159/roBrowserLegacy-RemoteClient-Rust"
readme = "README.md"
default-run = "robrowser-remoteclient"

[lib]
name = "robrowser_remoteclient"
path = "src/lib.rs"

[[bin]]
name = "robrowser-remoteclient"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "json"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = { version = "0.10", default-features = false }
regex-lite = "0.1"
percent-encoding = "2"
bytes = "1"
httpdate = "1"
# Managed-process requests are authenticated without sending the secret to a
# potentially reused control port. Use audited primitives, not custom crypto.
hmac = "0.12"
sha2 = "0.10"
# Brotli for game assets sent through the HTTPS sharing tunnel, where
# browsers offer it. Pure Rust, like flate2's backend.
brotli = { version = "8", default-features = false, features = ["std"] }
# Smaller pictures for players on a slow link (src/compact.rs): BMP and JPEG
# decoders, and libwebp's lossy encoder, built from the source it bundles.
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg"] }
webp = { version = "0.3", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process", "fs"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
