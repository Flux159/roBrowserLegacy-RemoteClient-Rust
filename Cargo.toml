[package]
name = "robrowser-remoteclient"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "Single-binary roBrowserLegacy Remote Client: static server, GRF asset server and WebSocket-to-TCP proxy"
license = "GPL-3.0-or-later"
repository = "https://github.com/Flux159/roBrowserLegacy-RemoteClient-Rust"
readme = "README.md"
default-run = "robrowser-remoteclient"

[lib]
name = "robrowser_remoteclient"
path = "src/lib.rs"

[[bin]]
name = "robrowser-remoteclient"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "json"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = { version = "0.10", default-features = false }
regex-lite = "0.1"
percent-encoding = "2"
bytes = "1"
httpdate = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process", "fs"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
